name: Mobile App CI/CD

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: development
        type: choice
        options:
          - development
          - qa
          - production 

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20'

jobs:
  validate:
    name: Validate (Lint, Typecheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      # - name: Fix Formatting Issues
      #   run: |
      #     echo "🔧 Fixing formatting issues..."
      #     chmod +x scripts/fix-formatting-ci.sh
      #     ./scripts/fix-formatting-ci.sh

      - name: Lint
        run: npm run lint || echo "Lint failed but continuing..."

      - name: Format Check
        run: npm run format:check || echo "Format check failed but continuing..."

      - name: Typecheck
        run: npm run type-check

  build_android:
    name: Build Android Artifact
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install JS dependencies
        run: npm install

      - name: Expo Prebuild (Android)
        run: |
          echo "🔍 Checking Android native project..."
          if [ ! -f "android/gradlew" ]; then
            echo "📱 Android native project not found, running prebuild..."
            npm run prebuild:android
          else
            echo " Android directory exists, running post-prebuild to ensure Fastlane files are present"
            ./scripts/post-prebuild.sh
          fi
          
          echo "🔍 Verifying Android project structure..."
          ls -la android/
          if [ -f "android/gradlew" ]; then
            echo " Android native project ready"
          else
            echo " Android native project not created properly"
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: Install Fastlane dependencies
        run: |
          echo " Debug: Current directory: $(pwd)"
          echo " Debug: Contents of android directory:"
          ls -la android/
          echo " Debug: Gemfile exists: $(test -f android/Gemfile && echo 'YES' || echo 'NO')"
          echo " Debug: Gemfile contents:"
          cat android/Gemfile
          cd android
          echo " Installing Fastlane dependencies..."
          bundle config set --local frozen false
          bundle install

      - name: Build Android release (AAB/APK)
        working-directory: android
        env:
          CI: true
          FASTLANE_SKIP_UPDATE_CHECK: true
        run: |
          bundle exec fastlane build_release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk

  build_ios:
    name: Build iOS Artifact
    runs-on: macos-15
    needs: validate
    env:
      HAS_IOS_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_JSON != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install JS dependencies
        run: npm install

      - name: Expo Prebuild (iOS)
        run: |
          echo "🔍 Checking iOS native project..."
          if [ ! -d "ios" ] || [ -z "$(ls -A ios/*.xcworkspace 2>/dev/null)" ]; then
            echo "📱 iOS native project not found, running prebuild..."
            npm run prebuild:ios
          else
            echo " iOS directory exists, running post-prebuild to ensure Fastlane files are present"
            ./scripts/post-prebuild.sh
          fi
          
          echo "🔍 Verifying iOS project structure..."
          ls -la ios/
          if [ -d "ios" ] && [ -n "$(ls -A ios/*.xcworkspace 2>/dev/null)" ]; then
            echo " iOS native project ready"
          else
            echo " iOS native project not created properly"
            exit 1
          fi


    
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false
        
      - name: Install Fastlane dependencies
        run: |
          echo " Debug: Current directory: $(pwd)"
          echo " Debug: Contents of ios directory:"
          ls -la ios/
          echo " Debug: Gemfile exists: $(test -f ios/Gemfile && echo 'YES' || echo 'NO')"
          echo " Debug: Gemfile contents:"
          cat ios/Gemfile
          cd ios
          echo " Installing Fastlane dependencies..."
          bundle config set --local frozen false
          bundle install
        

      - name: Build iOS (CI validation - no signing)
        if: ${{ env.HAS_IOS_API_KEY == 'false' }}
        working-directory: ios
        env:
          CI: true
        run: |
          bundle exec fastlane build_ci

      - name: Build iOS App Store IPA (with signing)
        if: ${{ env.HAS_IOS_API_KEY == 'true' }}
        working-directory: ios
        env:
          CI: true
          APP_STORE_CONNECT_API_KEY_JSON: ${{ secrets.APP_STORE_CONNECT_API_KEY_JSON }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          bundle exec fastlane build_appstore_ipa

      - name: Upload artifacts
        if: ${{ env.HAS_IOS_API_KEY == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: ios/build/ios/*.ipa

  approve_development:
    name: Manual Approval (Development)
    runs-on: ubuntu-latest
    needs: [build_android]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.environment == 'development' }}
    environment:
      name: development
    steps:
      - run: echo " Development deployment approved"

  approve_qa:
    name: Manual Approval (QA)
    runs-on: ubuntu-latest
    needs: [build_android, build_ios]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.environment == 'qa' }}
    environment:
      name: qa
    steps:
      - run: echo " QA deployment approved"

  approve_production:
    name: Manual Approval (Production)
    runs-on: ubuntu-latest
    needs: [build_android, build_ios]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.environment == 'production' }}
    environment:
      name: production
    steps:
      - run: echo " Production deployment approved"

  deploy_development:
    name: Deploy to Development
    runs-on: macos-14
    needs: [approve_development]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.environment == 'development' }}
    environment:
      name: development
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-build
          path: android-artifacts

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: Restore Fastlane files for deployment
        run: ./scripts/post-prebuild.sh

      - name: Deploy Android to Internal Track
        working-directory: android
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.ANDROID_SERVICE_ACCOUNT_JSON }}
        run: |
          bundle exec fastlane deploy_beta

      - name: Download iOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: ios-build
          path: ios-artifacts

      - name: Upload iOS IPA to TestFlight (Dev)
        working-directory: ios
        env:
          APP_STORE_CONNECT_API_KEY_JSON: ${{ secrets.APP_STORE_CONNECT_API_KEY_JSON }}
        run: |
          bundle exec fastlane upload_testflight_ipa ipa:$(ls ../ios-artifacts/*.ipa | head -n1)

  deploy_qa:
    name: Deploy to QA
    runs-on: macos-15
    needs: [approve_qa]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.environment == 'qa' }}
    environment:
      name: qa
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-build
          path: android-artifacts

      - name: Download iOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ios-build
          path: ios-artifacts

      - name: Restore Fastlane files for deployment
        run: ./scripts/post-prebuild.sh

      - name: Deploy Android (QA)
        working-directory: android
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.ANDROID_SERVICE_ACCOUNT_JSON }}
        run: |
          bundle exec fastlane deploy_beta

      - name: Deploy iOS to TestFlight (QA)
        working-directory: ios
        env:
          APP_STORE_CONNECT_API_KEY_JSON: ${{ secrets.APP_STORE_CONNECT_API_KEY_JSON }}
        run: |
          bundle exec fastlane upload_testflight_ipa ipa:$(ls ../ios-artifacts/*.ipa | head -n1)

  deploy_production:
    name: Deploy to Production
    runs-on: macos-15
    needs: [approve_production]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.environment == 'production' }}
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-build
          path: android-artifacts

      - name: Download iOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ios-build
          path: ios-artifacts

      - name: Restore Fastlane files for deployment
        run: ./scripts/post-prebuild.sh

      - name: Deploy Android to Production
        working-directory: android
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.ANDROID_SERVICE_ACCOUNT_JSON }}
        run: |
          bundle exec fastlane deploy_production

      - name: Upload iOS IPA to App Store
        working-directory: ios
        env:
          APP_STORE_CONNECT_API_KEY_JSON: ${{ secrets.APP_STORE_CONNECT_API_KEY_JSON }}
        run: |
          bundle exec fastlane upload_appstore_ipa ipa:$(ls ../ios-artifacts/*.ipa | head -n1)
